name: CI

on:
  push:
  pull_request:

jobs:
  # ── No build needed — runs on every push ───────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install style tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format shellcheck
          pip3 install black==25.9.0

      - name: Check formatting and analyse shell scripts
        run: bash ./scripts/lint.sh --check

  validate-opcodes:
    name: Validate opcode table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-reference instruction_table.gen.c against anomie reference
        # check_opcodes.sh exits 1 on any mnemonic / length / cycle mismatch.
        run: bash ./scripts/check_opcodes.sh

  # ── Needs compilation ───────────────────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure
        run: cmake -B build

      - name: Build — ChronoPlayer
        run: cmake --build build --target ChronoPlayer --parallel $(nproc)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure
        run: cmake -B build -DTESTING=ON

      - name: Build — ChronoPlayer
        run: cmake --build build --target ChronoPlayer --parallel $(nproc)

      - name: Build — tests
        run: cmake --build build --parallel $(nproc)

      - name: Run tests — CTest
        run: >
          ctest
          --test-dir build
          --output-on-failure
          --parallel $(nproc)

      - name: Run tests — visual grid
        if: always()
        run: bash ./scripts/run_all_tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/test-logs/
          retention-days: 7
