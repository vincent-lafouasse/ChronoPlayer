name: CI

on:
  push:
  pull_request:

jobs:
  # ── No build needed — reads source files only ──────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install style tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format shellcheck
          pip3 install black==25.9.0

      - name: Check formatting and analyse shell scripts
        run: bash ./scripts/lint.sh --check

  validate-opcodes:
    name: Validate opcode table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-reference instruction_table.gen.c against anomie reference
        # check_opcodes.sh exits 1 on any mnemonic / length / cycle mismatch.
        run: bash ./scripts/check_opcodes.sh

  # ── Needs compilation ───────────────────────────────────────────────────────

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc clang-tidy

      - name: Configure
        run: cmake -B build -DTESTING=ON

      # compile_commands.json is emitted by the Configure step
      # (CMAKE_EXPORT_COMPILE_COMMANDS is ON in CMakeLists.txt).
      # Generated files (*.gen.*) are excluded — they are machine-produced and
      # noisy without being actionable.
#      - name: Analyse — clang-tidy
#        run: |
#          find src -name '*.c' -o -name '*.h' | grep -v '\.gen\.' | \
#            xargs clang-tidy -p build
#
#      # Build the main binary and all 254 SingleStepTests* executables.
#      - name: Build
#        run: cmake --build build --parallel $(nproc)
#
#      # CTest gives structured pass/fail counts and stops early on failure.
#      # --parallel runs all 254 tests concurrently (they are independent).
#      - name: Run tests — CTest
#        run: >
#          ctest
#          --test-dir build
#          --output-on-failure
#          --parallel $(nproc)
#
#      # The custom script runs the same binaries but produces the 16×16 opcode
#      # grid and writes per-opcode logs to build/test-logs/*.log.
#      # always() ensures we see the grid even when CTest already reported a
#      # failure, which is useful for spotting patterns across opcodes.
