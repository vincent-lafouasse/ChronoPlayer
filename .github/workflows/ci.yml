name: CI

on:
  push:
  pull_request:

jobs:
  # ── No build needed — runs on every push ───────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install style tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format shellcheck
          pip3 install black==25.9.0

      - name: Check formatting and analyse shell scripts
        run: bash ./scripts/lint.sh --check

  validate-opcodes:
    name: Validate opcode table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-reference instruction_table.gen.c against anomie reference
        # check_opcodes.sh exits 1 on any mnemonic / length / cycle mismatch.
        run: bash ./scripts/check_opcodes.sh

  # ── Needs compilation — only when source changes ────────────────────────────
  # The 254 SingleStepTests executables take a long time to compile and the
  # generated test code never changes independently of src/.  Skipping this job
  # on pushes that only touch scripts, docs, or workflow files saves significant
  # CI time.

  build:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits[0].modified), 'src/') ||
      contains(toJson(github.event.commits[0].modified), 'CMakeLists.txt')
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure
        run: cmake -B build

      - name: Build — ChronoPlayer
        run: cmake --build build --target ChronoPlayer --parallel $(nproc)

  test:
    name: Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits[0].modified), 'src/') ||
      contains(toJson(github.event.commits[0].modified), 'test/')  ||
      contains(toJson(github.event.commits[0].modified), 'CMakeLists.txt')
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake gcc

      - name: Configure
        run: cmake -B build -DTESTING=ON

      - name: Build — ChronoPlayer
        run: cmake --build build --target ChronoPlayer --parallel $(nproc)

      - name: Build — tests
        run: cmake --build build --parallel $(nproc)

